<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfólio de Rafael Dias, desenvolvedor front-end e estudante de Engenharia de Software na FIAP." />
    <title>Rafael Dias | Portfólio</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para a tela não piscar no tema errado
      try {
        const saved = localStorage.getItem('theme')
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
